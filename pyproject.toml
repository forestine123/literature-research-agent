[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "literature-research-agent"
version = "0.2.0"
description = "具有证据追溯能力的文献调研Agent课程项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0,<2",
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pymupdf>=1.24,<2",
    "chromadb>=1.0,<2",
    "python-multipart>=0.0.18",
    "numpy>=1.26,<3",
    "markdown-it-py>=3,<5",
    "reportlab>=4,<5",
]

[project.scripts]
litresearch = "litresearch.cli:main"
litresearch-web = "litresearch.workbench.api:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/litresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
