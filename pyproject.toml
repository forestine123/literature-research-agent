[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "literature-research-agent"
version = "0.1.0"
description = "具有证据追溯能力的文献调研Agent课程项目"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "pydantic>=2.10,<3"]

[project.scripts]
litresearch = "litresearch.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/litresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
